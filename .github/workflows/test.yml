# https://docs.streamlit.io/develop/concepts/app-testing/automate-tests
name: StreamLit App Test
on:
  push:
    branches: ['@','main','master']
  pull_request:
    branches: ['@','main','master']
permissions:
  contents: read
  checks:  write
jobs:
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Streamlit App Action
        uses: streamlit/streamlit-app-action@v0.0.3
        with:
          app-path: 'scripts/tourismBR.py'
          ruff: False
          pytest-args: scripts/tests/tourismBRtest.py -v --junitxml=test-results.xml
      - name: Publish Test Results
        if: always( )
        uses: pmeier/pytest-results-action@v0.6.0
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
